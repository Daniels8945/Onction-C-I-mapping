# For the box that actually serves onctionenergy.com (46.105.211.204) —
# NOT for 144.91.104.174, where the mapping containers run.
#
# Paste inside the existing `server { ... }` block for onctionenergy.com.
# Requires the firewall rule on 144.91.104.174 (see deploy/DEPLOY.md,
# "Cross-server setup") that lets THIS box's IP reach ports 4001/4080
# there — without it these proxy_pass calls will just time out.

location = /mapping {
    return 301 /mapping/;
}

location /mapping/api/ {
    proxy_pass http://144.91.104.174:4001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /mapping/ {
    proxy_pass http://144.91.104.174:4080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
