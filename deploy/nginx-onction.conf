# Paste inside the existing `server { ... }` block for your domain.
# Adjust the alias path and backend port if you changed them during setup.

location = /onction {
    return 301 /onction/;
}

location /onction/api/ {
    proxy_pass http://127.0.0.1:4001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /onction/ {
    alias /home/onction/app/dist/;
    try_files $uri $uri/ /onction/index.html;
}
