# Host Nginx on 144.91.104.174 (the box serving onctionenergy.com).
# Paste inside the `listen 443 ssl` server { } block for onctionenergy.com
# in /etc/nginx/sites-available/onction-website, ABOVE the catch-all
# `location /` that proxies to the website. See deploy/DEPLOY.md, step 4.
# Ports must match MAPPING_API_PORT / MAPPING_WEB_PORT in the app's .env
# (defaults: 4001 for the API container, 4080 for the frontend container).

location = /mapping {
    return 301 /mapping/;
}

location /mapping/api/ {
    proxy_pass http://127.0.0.1:4001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /mapping/ {
    proxy_pass http://127.0.0.1:4080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
