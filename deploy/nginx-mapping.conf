# Paste inside the existing `server { ... }` block for onction.com.
# Ports must match MAPPING_API_PORT / MAPPING_WEB_PORT in the app's .env
# (defaults: 4001 for the API container, 4080 for the frontend container).

location = /mapping {
    return 301 /mapping/;
}

location /mapping/api/ {
    proxy_pass http://127.0.0.1:4001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /mapping/ {
    proxy_pass http://127.0.0.1:4080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
