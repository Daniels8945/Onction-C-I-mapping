server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — resolve "api" per request so nginx still starts
    # (and serves the static app) even if the api container isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # In production the front Nginx strips the /mapping/ prefix before it gets
    # here (see deploy/nginx-mapping*.conf), so only "/" below is hit. These
    # two blocks make this container usable on its own too — e.g. locally at
    # http://localhost:4080/mapping/ — since the build's asset URLs and
    # VITE_API_URL both carry the /mapping prefix.
    location = /mapping {
        return 301 /mapping/;
    }

    location ^~ /mapping/api/ {
        set $api_upstream http://api:4000;
        rewrite ^/mapping(/api/.*)$ $1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /mapping/ {
        rewrite ^/mapping(/.*)$ $1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
